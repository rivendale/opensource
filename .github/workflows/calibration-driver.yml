name: Offline calibration driver checks
on:
  pull_request:
    paths:
      - '.github/workflows/calibration-driver.yml'
      - 'evals/studio/game-art/review-calibration/**'
      - 'evals/studio/game-art/review-plans/**'
      - 'skills/studio/runner/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/calibration-driver.yml'
      - 'evals/studio/game-art/review-calibration/**'
      - 'evals/studio/game-art/review-plans/**'
      - 'skills/studio/runner/**'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fixed plan and synthetic event reconstruction
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_plan.py
      - name: Exclusive persistence and disk corruption checks
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_persist.py
      - name: Shared inherited-descriptor entry checks
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_entry.py
      - name: Renderer availability (no dependency downloads)
        id: renderer
        run: |
          if command -v convert >/dev/null; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            convert -version
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Renderer absent: rendered mock tests require the approved operator host.'
          fi
      - name: Full mock batch and stop behavior
        if: steps.renderer.outputs.available == 'true'
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_collect.py
      - name: Full mock disk batch and receipt identity
        if: steps.renderer.outputs.available == 'true'
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_batch.py
      - name: Structural guard mutations
        run: python3 evals/studio/game-art/review-calibration/tests/driver_mutants.py --structural-only
      - name: Rendered component guard mutations
        if: steps.renderer.outputs.available == 'true'
        run: python3 evals/studio/game-art/review-calibration/tests/driver_mutants.py
      - name: Explicit operator-fixture availability status
        run: python3 evals/studio/game-art/review-calibration/tests/test_driver_fixture.py
