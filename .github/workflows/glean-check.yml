name: Offline glean checks
on:
  pull_request:
    paths:
      - 'tools/glean-*'
      - 'tools/evals/**'
      - 'tools/build_catalog.py'
      - 'skills/glean/**'
      - '**/*.md'
      - 'tools/check_links.py'
      - 'tests/tools/test_runner_cleanup.py'
      - '.github/workflows/glean-check.yml'
permissions:
  contents: read
jobs:
  glean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out fixture and tool sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Eval runner cleanup never chmods through a symlink
        run: python3 tests/tools/test_runner_cleanup.py
      - name: Existing independent glean fixtures
        run: python3 tools/evals/runner.py glean
      - name: Relative Markdown links
        run: python3 tools/check_links.py
      - name: Link checker selftests
        run: python3 tools/check_links.py --selftest
